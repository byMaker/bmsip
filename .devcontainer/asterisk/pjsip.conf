[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2

[1001]
type=endpoint
context=from-internal
disallow=all
allow=opus,g722,ulaw,alaw
auth=auth1001
aors=1001
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[auth1001]
type=auth
auth_type=userpass
username=1001
password=secret1001

[1001]
type=aor
max_contacts=4
remove_existing=yes

