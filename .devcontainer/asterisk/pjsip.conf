[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
auth=auth1001
aors=1001
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[auth1001]
type=auth
auth_type=userpass
username=1001
password=secret1001

[1001]
type=aor
max_contacts=4
remove_existing=yes

[1002]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw
auth=auth1002
aors=1002
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[auth1002]
type=auth
auth_type=userpass
username=1002
password=secret1002

[1002]
type=aor
max_contacts=4
remove_existing=yes
