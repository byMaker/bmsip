#!KAMAILIO

debug=2
log_stderror=yes
fork=yes
children=2
auto_aliases=no
alias="kamailio"
alias="kamailio:5060"
listen=udp:0.0.0.0:5060
disable_tcp=yes

mpath="/usr/lib/kamailio/modules/"

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "auth.so"

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 0)
modparam("usrloc", "db_mode", 0)
modparam("registrar", "default_expires", 300)

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (is_method("OPTIONS") && uri == myself) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) {
            if (!t_relay()) {
                sl_reply_error();
            }
            exit;
        }
        if (is_method("ACK")) {
            if (t_check_trans()) {
                t_relay();
                exit;
            }
            exit;
        }
        sl_send_reply("404", "Not Here");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            if (!t_relay()) {
                sl_reply_error();
            }
        }
        exit;
    }

    t_check_trans();

    if (is_method("REGISTER")) {
        $var(pass) = "secret" + $au;
        if (!pv_auth_check("$fd", "$var(pass)", "0", "0")) {
            auth_challenge("$fd", "0");
            exit;
        }
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }

    if (!is_method("INVITE")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    record_route();

    if (!lookup("location")) {
        sl_send_reply("404", "Not Found");
        exit;
    }

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

