services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    user: "1000:1000"
    volumes:
      - .:/workspace
      - bmsip-cargo-cache:/cargo
      - /run/user/1000/pulse:/run/user/1000/pulse
    environment:
      PULSE_SERVER: unix:/run/user/1000/pulse/native
    devices:
      - /dev/snd:/dev/snd
    working_dir: /workspace
    command: sleep infinity
    networks:
      - bmsip-net

  asterisk:
    build:
      context: .devcontainer/asterisk
      dockerfile: Dockerfile
    hostname: asterisk
    networks:
      - bmsip-net

volumes:
  bmsip-cargo-cache:

networks:
  bmsip-net:
    driver: bridge
